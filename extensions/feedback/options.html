<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tdoc Feedback settings</title>
<style>:root{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#19151f;background:#f6f4f8}body{margin:0}.wrap{max-width:620px;margin:48px auto;padding:0 24px}h1{font-size:24px;margin:0 0 6px}p{color:#706979;margin:0 0 24px}.card{background:#fff;border:1px solid #e3dfe7;border-radius:14px;padding:22px;box-shadow:0 12px 35px rgba(37,25,53,.07)}label{display:block;font-weight:650}input{display:block;width:100%;box-sizing:border-box;margin-top:7px;border:1px solid #d5d0da;border-radius:8px;padding:10px;font:inherit}small{display:block;color:#7c7485;font-weight:400;margin-top:6px}.actions{display:flex;align-items:center;gap:12px;margin-top:20px}button{border:0;border-radius:8px;background:#19151f;color:#fff;padding:9px 13px;font:650 13px inherit;cursor:pointer}#status{color:#675f70}</style></head>
<body><main class="wrap"><h1>tdoc Feedback</h1><p>Connect live product comments to one existing tdoc. Login, threads, mentions, notifications, permissions, storage, and agent pull stay in tdoc.</p><form class="card"><label>Project tdoc URL<input name="documentUrl" type="url" required placeholder="https://tdoc.dev/d/my-app-feedback/v/1"><small>Use a tdoc you own for this app. Its access settings decide who can view and comment; its slug is what the agent pulls.</small></label><div class="actions"><button type="submit">Connect</button><span id="status"></span></div></form></main><script src="options.js"></script></body></html>
