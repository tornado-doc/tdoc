<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slides mode</title>
<style>body{background:#eee}.slide{aspect-ratio:16/9;background:#fff;border:1px solid #ccc;margin:0 0 24px;padding:24px;box-sizing:border-box}.slide h2{margin:0}</style></head>
<body><div class="wrap"><h1>Deck</h1>
<section class="slide" data-tdoc-slide id="s1"><h2>First slide</h2><p>Opening words.</p></section>
<section class="slide" data-tdoc-slide id="s2"><h2>Second slide</h2><p>Middle words.</p></section>
<section class="slide" data-tdoc-slide id="s3"><h2>Third slide</h2><p>Closing words.</p><p class="tall" style="height:900px">Too much.</p></section>
</div></body></html>
