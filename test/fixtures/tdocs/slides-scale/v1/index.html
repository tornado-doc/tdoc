<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slides scale</title>
<style>body{margin:0;background:#eee}.wrap{max-width:860px;margin:0 auto;padding:16px}.slide{aspect-ratio:16/9;background:#fff;box-sizing:border-box;margin:0 0 24px}.cq{container-type:inline-size;padding:4cqw}.cq h2{font-size:6.4cqw;margin:0}.cq p{font-size:2.5cqw}.px{padding:32px}.px h2{font-size:48px;margin:0}.px p{font-size:20px}</style></head>
<body><div class="wrap"><h1>Deck</h1>
<section class="slide cq" data-tdoc-slide id="c1"><h2 id="c1t">Scaled title</h2><p>Body text that scales with the card.</p></section>
<section class="slide px" data-tdoc-slide id="p1"><h2 id="p1t">Pixel title</h2><p>Body text written in pixels.</p></section>
</div></body></html>
