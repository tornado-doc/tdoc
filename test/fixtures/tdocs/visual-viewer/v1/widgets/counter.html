<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive counter</title><style>body{margin:0;min-height:100vh;display:grid;place-content:center;gap:16px;text-align:center;background:#e7edfa;color:#123;font:20px system-ui}button{font:inherit;padding:8px 20px}output{font-size:40px}</style><output id="count">0</output><button id="add">Add one</button><script>document.querySelector('#add').onclick=()=>{document.querySelector('#count').textContent=Number(document.querySelector('#count').textContent)+1;};</script></html>
