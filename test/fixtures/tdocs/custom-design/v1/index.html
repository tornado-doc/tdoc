<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom document design</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#2a2f3a;--txt:#e6e8ee;--mut:#9aa3b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.6 -apple-system,sans-serif}
.wrap{max-width:1050px;margin:0 auto;padding:30px 18px 80px}h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:30px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.mut{color:var(--mut);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13.5px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:#1d212a}
</style></head><body><div class="wrap">
<h1>Custom document design</h1><p class="mut">The author's colors remain unchanged.</p>
<h2>Sample comparison</h2><table><tr><th>Item</th><th>Value</th></tr><tr><td>Sample A</td><td>42</td></tr><tr><td>Sample B</td><td>18</td></tr></table>
<div class="card" data-tdoc-artifact aria-label="Custom palette panel">Headings, tables, and cards share the author's palette.</div>
</div></body></html>
