<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slides legacy</title>
<style>
body{margin:0;background:#eee;font-family:system-ui}.wrap{max-width:960px;margin:0 auto;padding:16px}
.slide{position:relative;aspect-ratio:16/9;overflow:hidden;background:#fff;margin:0 0 24px}
.slide h2{position:absolute;left:60px;top:48px;margin:0;font-size:48px}
.slide p{position:absolute;left:60px;top:150px;width:520px;margin:0;font-size:22px}
.slide .stat{position:absolute;right:60px;bottom:48px;font-size:96px;font-weight:700;color:#1652f0}
</style></head>
<body><div class="wrap"><h1>Legacy deck</h1>
<section class="slide" data-tdoc-slide id="l1"><h2 id="l1t">Placed by hand</h2><p>Every line on this slide sits where the author put it.</p><div class="stat">42%</div></section>
<section class="slide" data-tdoc-slide id="l2"><h2>Second slide</h2><p>Absolute layout cannot reflow on a phone.</p><div class="stat">7x</div></section>
</div></body></html>
