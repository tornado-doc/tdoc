name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo and runs tests. It never
# needs to write contents, packages, or any other scope. Pinning permissions
# here means even a compromised step (or action) can't push to the repo or
# mint a writable token. Critical because this runs on `pull_request` from
# forks.
permissions:
  contents: read

# A new push to a PR supersedes the run for the previous head: cancel it.
# Pushes to main get a per-commit group and are never cancelled, so every
# main commit keeps its own test result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: offline test suite
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a full commit SHA, not a mutable @v4 tag. A tag
      # can be repointed by a compromised maintainer or a tag-hijack (cf. the
      # 2025 tj-actions/changed-files incident) and would silently run attacker
      # code in our PR-triggered pipeline. The trailing comment records the
      # human-readable version the SHA corresponds to; bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22: node:sqlite stands in for the search store's Durable Object
          # SQLite (full-text-search.test.js); the deploy already tests on 22.
          node-version: '22'
      # jq is needed by the CLI tests that drive bin/tdoc-* hermetically.
      - name: Ensure jq
        run: jq --version || sudo apt-get update && sudo apt-get install -y jq
      - name: Run offline tests
        run: npm test
        env:
          # Complexity guards (test/helpers/perf-budget.js) log what they
          # measured; the step below puts it in the job summary.
          TDOC_PERF_LOG: ${{ runner.temp }}/perf.jsonl
      - name: Timing summary
        if: always()
        run: node test/perf-summary.js "$RUNNER_TEMP/perf.jsonl" 'Offline timing guards'
      # Manifest schema guard: plugin.json + marketplace.json must match the
      # field types Claude Code validates at load/install time. This class of
      # bug shipped to users 4x (#36 owner, #42 repository) — keep it pinned.
      # (npm test already runs this; the explicit step makes CI logs self-
      # documenting and survives a runner restructure.)
      - name: Validate plugin/marketplace manifests
        run: node test/manifest.test.js
      # Static guard: worker/server, the shell boot builder, and the only script
      # injected into author HTML (frame-probe) must parse. The provider UI
      # itself is a React app under shell/src; its built runtime is checked by
      # the `shell runtime` job below.
      - name: Syntax check
        run: |
          node --check worker/worker.js
          node --check server/server.js
          node --check server/shell.js
          node --check server/frame-probe.js
          node --check server/runtime-assets.js
          node --check bin/tdoc-bundle
          bash -n bin/tdoc-publish
          bash -n bin/tdoc-pull
          bash -n bin/tdoc-new
          bash -n bin/tdoc-doctor
      # ShellCheck the credential-handling CLIs. `bash -n` above only catches
      # syntax errors; ShellCheck catches the dangerous class — unquoted
      # expansions in a token path, word-splitting in a curl arg, sed on
      # untrusted input — which is exactly where a script that reads Cloudflare
      # OAuth tokens and builds Authorization headers gets a real bug.
      # shellcheck is preinstalled on ubuntu-latest runners.
      #
      # SC2034 (unused variable) is excluded: it's pure style hygiene, not a
      # security/correctness signal, and the existing scripts keep a couple of
      # intentional scaffolding vars (e.g. HTML_PATH, HAS_JQ). The gate is for
      # the dangerous classes (quoting/word-splitting/injection), not lint nits.
      - name: ShellCheck CLIs
        run: shellcheck --severity=warning --exclude=SC2034 bin/tdoc-publish bin/tdoc-doctor bin/tdoc-pull bin/tdoc-new bin/tdoc-unpublish bin/tdoc-restore bin/tdoc-update

  svg-preview:
    name: SVG preview and font coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - run: npm ci --prefix tools/svg-preview --ignore-scripts --no-audit --no-fund
      - run: npm run test:svg

  browser:
    name: browser regressions (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Browsers and their system libraries come preinstalled in the official
    # image, so no apt step (it hung for 15+ min on some runners). The tag
    # must match the locked playwright version (test/ci-workflow.test.js).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22 for node:sqlite (full-text-search-ui.test.js).
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node test/run.js --browser --shard=${{ matrix.shard }}/4
        env:
          # Performance budgets (frame times, sort ms) warn here instead of
          # failing: the non-blocking `perf` job enforces them.
          TDOC_PERF: report
          TDOC_PERF_LOG: ${{ runner.temp }}/perf.jsonl
      - name: Timing summary
        if: always()
        run: node test/perf-summary.js "$RUNNER_TEMP/perf.jsonl" 'Browser timing (shard ${{ matrix.shard }}, budgets reported only)'
      - if: matrix.shard == 4
        run: |
          TDOC_TEST_BROWSER=webkit node test/resolved-visibility-ui.test.js
          TDOC_TEST_BROWSER=webkit node test/version-diff-ui.test.js
          TDOC_TEST_BROWSER=webkit node test/custom-design-theme.test.js
          TDOC_TEST_BROWSER=webkit node test/visual-viewer.test.js
          TDOC_TEST_BROWSER=webkit node test/reply-activity-ui.test.js

  # Pure performance budgets (scroll frame times, sort and search ms on 10k
  # rows), enforced. Shared runners vary run to run, so this job never blocks
  # a merge (continue-on-error on the job): an overrun shows as this check
  # failing, the run stays green, the numbers are in the job summary. Functional checks of the same tests (import,
  # load, scroll, sort, search, save) block in the browser job above.
  perf:
    name: performance budgets (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Performance budgets
        id: budgets
        run: node test/run.js --perf
        env:
          TDOC_PERF_LOG: ${{ runner.temp }}/perf.jsonl
      - name: Summary
        if: always()
        run: |
          node test/perf-summary.js "$RUNNER_TEMP/perf.jsonl" 'Performance budgets (enforced, non-blocking)'
          if [ "${{ steps.budgets.outcome }}" = "failure" ]; then
            echo "::warning title=performance budgets::over budget or failed; see the job summary (this job does not block merging)"
          fi

  shell-runtime:
    name: shell runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
      # The React provider UI (shell/src) is built by Vite into server/runtime/
      # and the output is COMMITTED: skill users run server/server.js straight
      # from the checkout, and bin/tdoc-bundle embeds the same bytes into the
      # Worker — neither runs npm install. Vite's output is content-hashed and
      # deterministic, so rebuilding must reproduce the committed bytes exactly.
      # A diff here means someone edited shell/src without `npm run build:shell`.
      - run: npm ci
      - run: npm run build:shell
      # build:shell clears the output directory; restore the independently built bookmarklet.
      - run: npm run build:feedback
      # Same for the push service worker (/tdoc-sw.js).
      - run: npm run build:sw
      - name: Preview renderer in workerd
        run: npm run test:workerd
      # Download output read back with marked and SheetJS; the offline job has no
      # node_modules, so these checks run here after npm ci.
      - name: Download output through real parsers
        run: node test/doc-download-deps.test.js
      - name: Edit as Markdown conversion (marked)
        run: node --experimental-detect-module test/markdown-source.test.js
      - name: Committed runtime matches shell/src
        run: |
          git add -N server/runtime
          git diff --exit-code --stat server/runtime || {
            echo "server/runtime is stale — run npm run build:shell and commit the result" >&2
            exit 1
          }
