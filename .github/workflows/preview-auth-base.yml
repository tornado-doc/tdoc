name: Deploy fixed preview sign-in callback

# Run once after the preview Clerk OAuth app and GitHub Actions settings exist.
# Only main may update the stable tdoc-preview host. PR builds keep publishing
# their version aliases through preview.yml and never deploy to this host.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'tornado-doc/tdoc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TDOC_PREVIEW_OIDC_CLIENT_ID: ${{ vars.TDOC_PREVIEW_OIDC_CLIENT_ID }}
      TDOC_PREVIEW_OIDC_CLIENT_SECRET: ${{ secrets.TDOC_PREVIEW_OIDC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Require preview credentials
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TDOC_PREVIEW_OIDC_CLIENT_ID TDOC_PREVIEW_OIDC_CLIENT_SECRET; do
            if [ -z "${!key:-}" ]; then echo "Missing $key" >&2; exit 1; fi
          done

      - name: Preview login regression
        run: |
          node test/preview-oidc-login.test.js
          node test/preview-workflow.test.js

      - name: Install wrangler
        run: npm i -g wrangler@4.90.1

      - name: Materialize isolated preview Worker config
        run: |
          set -euo pipefail
          KV_ID="$(wrangler kv namespace list | jq -r '.[] | select(.title=="tdoc-preview-META") | .id' | head -1)"
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "tdoc-preview-META is missing; run the PR preview workflow first" >&2
            exit 1
          fi
          sed -e "s/PLACEHOLDER_PREVIEW_KV_ID/${KV_ID}/g" \
            worker/wrangler.preview.toml.template > worker/wrangler.preview.toml
          node bin/tdoc-preview-oidc-config.js worker/wrangler.preview.toml
          if grep -q 'bucket_name = "tdoc-docs"' worker/wrangler.preview.toml; then
            echo "preview Worker bound production R2" >&2; exit 1
          fi
          if grep -q '80fd771188f649a093a9f0c812f540fb' worker/wrangler.preview.toml; then
            echo "preview Worker bound production META" >&2; exit 1
          fi

      - name: Bundle preview Worker
        env:
          SKILL_DIR: ${{ github.workspace }}
          OUT_DIR: ${{ github.workspace }}/worker
          TDOC_GENERATED_BY: tdoc-preview
          TDOC_SOURCE_SHA: ${{ github.sha }}
          TDOC_PREVIEW: '1'
        run: node bin/tdoc-bundle

      - name: Deploy stable callback host
        working-directory: worker
        run: |
          set -euo pipefail
          test -f _worker.bundled.js
          if grep -q 'export class CommentsStore {' _worker.bundled.js; then
            echo "preview bundle still exports a Durable Object" >&2; exit 1
          fi
          wrangler deploy --name tdoc-preview -c wrangler.preview.toml
          printf '%s' "$TDOC_PREVIEW_OIDC_CLIENT_SECRET" | wrangler secret put OIDC_CLIENT_SECRET --name tdoc-preview
