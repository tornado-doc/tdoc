name: backfill preview cards

# Replaces old automatic preview cards on tdoc.dev without anyone holding the
# admin token. Manual only. Counts by default; writes only with apply=true.
# Cards a person uploaded and screenshots are never touched (see
# /api/admin/preview-cards/backfill).
#
# Required GitHub secret:
#   TDOC_DEV_UPLOAD_TOKEN — the tdoc.dev Worker's TDOC_UPLOAD_TOKEN
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Replace the cards (off: only count them)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backfill-preview-cards
  cancel-in-progress: false

jobs:
  backfill:
    if: github.repository == 'tornado-doc/tdoc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Backfill
        env:
          TDOC_ADMIN_TOKEN: ${{ secrets.TDOC_DEV_UPLOAD_TOKEN }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: node bin/tdoc-backfill-preview-cards --base-url https://tdoc.dev $APPLY
