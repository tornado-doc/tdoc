name: Onboarding MCP review
on:
  push:
    branches: [serena/entrance-polish-20261028]
    paths-ignore: ['server/runtime/**']
permissions:
  contents: read
concurrency:
  group: onboarding-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      TDOC_UI_SHOTS: /tmp/onboarding-mcp-shots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: apt-get update && apt-get install -y --no-install-recommends jq
      - run: npm ci
      - run: npm run build:shell
      - run: npm run build:feedback
      - run: npm run build:sw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onboarding-mcp-runtime
          path: server/runtime/
          retention-days: 3
      - run: npm test
      - run: node test/daemon-onboarding-browser.test.js
      - run: node test/connect-ai-apps-ui.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: onboarding-mcp-screenshots
          path: /tmp/onboarding-mcp-shots/
          retention-days: 3
