name: Onboarding runtime build
on:
  push:
    branches: [serena/onboarding-setup-build]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:shell
      - run: npm run build:feedback
      - run: npm run build:sw
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onboarding-runtime-55ffa67
          path: server/runtime/
          retention-days: 1
          if-no-files-found: error
      - run: node test/agent-authorship.test.js
      - run: node test/comment-wipe-authorship.test.js
      - run: node test/computer-settings.test.js
      - run: node test/tdoc-start.test.js
      - run: node test/ui-primitives.test.js
      - run: node test/daemon-onboarding.test.js
      - run: node test/onboarding-journey.test.js
      - run: node test/dev-mode.test.js
      - run: node test/setup-gate.test.js
      - run: npx playwright install --with-deps chromium
      - run: node test/daemon-onboarding-browser.test.js
        env:
          TDOC_UI_SHOTS: /tmp/onboarding-runtime-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: onboarding-runtime-shots
          path: /tmp/onboarding-runtime-shots/
          retention-days: 1
