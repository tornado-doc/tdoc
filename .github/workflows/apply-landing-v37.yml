name: apply-landing-v37

on:
  workflow_dispatch:
  push:
    branches: [feat/tornado-dog-landing]
    paths:
      - scripts/apply-landing-v37.py
      - .github/workflows/apply-landing-v37.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/tornado-dog-landing
      - name: Build v37 from v36
        run: python3 scripts/apply-landing-v37.py
      - name: Commit v37
        run: |
          set -eu
          git add landing/tornado-doc/v37/index.html landing/tornado-doc/meta.json landing/tornado-doc/comments.json test/tornado-doc-landing.test.js
          git config user.name "serenakeyitan"
          git config user.email "94026305+serenakeyitan@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "landing v37: tdoc quotes, drop OpenTag trusted-by leftovers"
          git push origin HEAD:feat/tornado-dog-landing
