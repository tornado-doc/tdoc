<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Queue</title>
<style>
  /* first-tree idiom: stat cards on a tinted gradient, a live status pill, and
     the sources named on the card itself. A doc-shaped dashboard says where
     its numbers came from and when they last moved. */
  html,body{margin:0;background:#fff;font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#10121a}
  body{padding:13px 14px;display:flex;flex-direction:column;gap:11px;box-sizing:border-box;min-height:100%}
  .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
  .ttl{font-size:13px;font-weight:650;letter-spacing:-.01em}
  .live{display:inline-flex;align-items:center;gap:6px;margin-left:auto;
    padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;
    background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#0f7a55}
  .pulse{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pl 2s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .srcs{display:flex;gap:6px;flex-wrap:wrap;flex:none}
  .src{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;
    background:#f5f6f8;border:1px solid #e4e7ee;font-size:11px;color:#5b6070}
  .src b{width:7px;height:7px;border-radius:2px;display:inline-block}
  .card{flex:1;min-height:0;padding:14px;border-radius:12px;border:1px solid #e4e7ee;
    background:linear-gradient(135deg,rgba(50,145,255,.06) 0%,rgba(139,92,246,.06) 100%)}
  .foot{flex:none;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#8e939f;flex-wrap:wrap}
 canvas{flex:1;min-height:0;width:100%;display:block}
 .legend{display:flex;gap:16px;font-size:11.5px;color:#767c8b;flex:none}
 .k{display:inline-flex;align-items:center;gap:6px}
 .sw{width:9px;height:9px;border-radius:2px}
</style></head><body>
<div class="hd"><span class="ttl">Retry queue depth</span><span class="live"><span class="pulse"></span>Live · every 30 s</span></div>
<div class="srcs"><span class="src"><b style="background:#f59e0b"></b>Grafana</span><span class="src"><b style="background:#10121a"></b>GitHub Actions</span><span class="src"><b style="background:#10b981"></b>PagerDuty</span></div>
<div class="card"><canvas id="c"></canvas>
<div class="legend">
  <span class="k"><span class="sw" style="background:#1652f0"></span>queued</span>
  <span class="k"><span class="sw" style="background:#1a7340"></span>drained</span>
  <span class="k"><span class="sw" style="background:#c3452f"></span>retried</span>
</div>
<script>
// Arrivals outrun two workers, the backlog builds, retries spike, then it
// drains. The shape is the argument the doc is making.
(function(){
 var c=document.getElementById('c'),x=c.getContext('2d'),t=0,hist=[];
 function size(){var r=c.getBoundingClientRect(),d=devicePixelRatio||1;
   c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);return r;}
 function step(){
   var r=size(),W=r.width,H=r.height;
   t+=1;
   var arrive=6+5*Math.sin(t/22)+3*Math.sin(t/7);
   var drain=7, q=(hist.length?hist[hist.length-1].q:0)+arrive-drain;
   if(q<0)q=0; if(q>40)q=40;
   hist.push({q:q,r:Math.max(0,(q-18)/22*6)});
   if(hist.length>Math.floor(W/4))hist.shift();
   x.clearRect(0,0,W,H);
   x.strokeStyle='#eef0f5';x.lineWidth=1;
   for(var g=1;g<4;g++){var y=H*g/4;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}
   function line(key,col,fill){
     x.beginPath();
     hist.forEach(function(h,i){var px=i*4,py=H-(h[key]/40)*H*0.92;i?x.lineTo(px,py):x.moveTo(px,py);});
     x.strokeStyle=col;x.lineWidth=2;x.stroke();
     if(fill){x.lineTo((hist.length-1)*4,H);x.lineTo(0,H);x.closePath();x.fillStyle=fill;x.fill();}
   }
   line('q','#1652f0','rgba(22,82,240,.09)');
   line('r','#c3452f',null);
   x.fillStyle='#1a7340';x.fillRect(0,H-2,W,2);
 }
 step(); setInterval(step,110);
 addEventListener('resize',function(){size();});
})();
</script></div>
<div class="foot"><span>two workers, bursty arrivals</span><span>Updated just now</span></div>
</body></html>
