<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Channel mix</title>
<style>
 html,body{margin:0;height:100%;background:#fff;font:13px system-ui,-apple-system,sans-serif;color:#10121a}
 body{display:flex;flex-direction:column;padding:14px;box-sizing:border-box;gap:11px}
 .row{display:grid;grid-template-columns:96px 1fr 54px;align-items:center;gap:10px}
 .nm{color:#454a58}
 .track{height:15px;background:#f0f1f4;border-radius:4px;overflow:hidden}
 .bar{height:100%;width:0;border-radius:4px;transition:width 1.1s cubic-bezier(.22,.8,.28,1)}
 .val{text-align:right;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:#10121a}
 .cap{margin-top:auto;font-size:11.5px;color:#767c8b}
 @media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style></head><body>
<div id="rows"></div>
<div class="cap">Signups by channel, last 90 days.</div>
<script>
(function(){
 var D=[['Referral',34,'#1652f0'],['Organic',26,'#1a7340'],['Paid social',19,'#D97757'],['Partnerships',13,'#7a5bd6'],['Direct',8,'#767c8b']];
 var host=document.getElementById('rows');
 D.forEach(function(d){
   var r=document.createElement('div');r.className='row';
   r.innerHTML='<span class="nm">'+d[0]+'</span><div class="track"><div class="bar" style="background:'+d[2]+'"></div></div><span class="val">0%</span>';
   host.appendChild(r);
 });
 function run(){
   var bars=host.querySelectorAll('.bar'), vals=host.querySelectorAll('.val');
   bars.forEach(function(b,i){b.style.width='0';vals[i].textContent='0%';});
   setTimeout(function(){
     bars.forEach(function(b,i){
       b.style.width=D[i][1]+'%';
       var n=0,step=Math.max(1,Math.round(D[i][1]/22));
       var t=setInterval(function(){n+=step;if(n>=D[i][1]){n=D[i][1];clearInterval(t);}vals[i].textContent=n+'%';},45);
     });
   },120);
 }
 run(); setInterval(run,6500);
})();
</script></body></html>
