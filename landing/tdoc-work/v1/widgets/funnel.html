<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Funnel</title>
<style>
  /* tdoc's own visual: its palette, its chip shapes, square corners. The
     card is clipped rather than scrollable — an artifact in a doc is a view
     onto data, not a pane you drag around. */
  html,body{margin:0;height:100%;background:#fff;font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#10121a;overflow:hidden}
  body{padding:13px 14px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
  .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:none}
  .ttl{font-size:13px;font-weight:650;letter-spacing:-.01em}
  .live{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:2px 9px;
    font-size:11px;font-weight:700;color:#1a7340;background:#e8f5ed;border:1px solid #cfe0d6}
  .pulse{width:6px;height:6px;background:#1a7340;animation:pl 2s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.pulse{animation:none}}
  .srcs{display:flex;gap:6px;flex-wrap:wrap;flex:none}
  .src{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;
    background:#f5f6f8;border:1px solid #e5e5e5;font-size:11px;color:#5b6070}
  .src b{width:7px;height:7px;display:inline-block}
  .card{flex:1;min-height:0;padding:13px;border:1px solid #e4e7ee;background:#fff;overflow:hidden}
  .foot{flex:none;display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#767c8b;flex-wrap:wrap}
 .st{display:flex;align-items:center;gap:10px}
 .bar{height:26px;background:#1652f0;border-radius:0;width:0;transition:width .9s cubic-bezier(.22,.8,.28,1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;box-sizing:border-box;color:#fff;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
 .lb{width:108px;color:#454a58;flex:none}
 .drop{font-size:11.5px;color:#c3452f;width:52px;text-align:right}
 .cap{margin-top:auto;font-size:11.5px;color:#767c8b}
 @media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style></head><body>
<div class="hd"><span class="ttl">Signup to first publish</span><span class="live"><span class="pulse"></span>Live · every 15 min</span></div>
<div class="srcs"><span class="src"><b style="background:#f59e0b"></b>Google Analytics</span><span class="src"><b style="background:#3291ff"></b>Amplitude</span><span class="src"><b style="background:#10b981"></b>Slack #research</span></div>
<div class="card"><div id="s"></div>

<script>
(function(){
 var D=[['Visited',100,''],['Signed up',41,'-59%'],['Installed',28,'-32%'],['First doc',22,'-21%'],['Published',19,'-14%']];
 var host=document.getElementById('s');
 D.forEach(function(d){
   var r=document.createElement('div');r.className='st';
   r.innerHTML='<span class="lb">'+d[0]+'</span><div class="bar" data-w="'+d[1]+'">'+d[1]+'%</div><span class="drop">'+d[2]+'</span>';
   host.appendChild(r);
 });
 function run(){
   var bars=host.querySelectorAll('.bar');
   bars.forEach(function(b){b.style.width='0'});
   bars.forEach(function(b,i){setTimeout(function(){b.style.width=(b.dataset.w*0.82)+'%'},140*i+120)});
 }
 run(); setInterval(run,6500);
})();
</script></div>
<div class="foot"><span>4,182 sessions in the window</span><span>Updated 6 min ago</span></div>
</body></html>
