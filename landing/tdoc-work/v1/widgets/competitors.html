 .sw{width:8px;height:8px;flex:none}
 .srccell{font-size:11px;color:#9aa0aa;white-space:nowrap}
 .n{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;color:#10121a;white-space:nowrap}
 .big{font-size:14px;font-weight:600}
 .up{color:#1a7340}.dn{color:#c3452f}.win{color:#1a7340}
 @media (max-width:430px){ th.ctx:nth-child(2),td.srccell{display:none} th,td{font-size:11px} }
